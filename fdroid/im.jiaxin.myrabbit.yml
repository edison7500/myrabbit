# Draft only. Copy into fdroiddata/metadata after completing the release gates.
Disabled: Packaging draft; public release commit, Linux toolchain provisioning and scanner validation pending
Categories:
  - Internet
License: MIT
SourceCode: https://github.com/edison7500/myrabbit
IssueTracker: https://github.com/edison7500/myrabbit/issues

RepoType: git
Repo: https://github.com/edison7500/myrabbit.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    disable: Replace the commit placeholder and validate the full recipe before enabling
    commit: REPLACE_WITH_TESTED_RELEASE_COMMIT_SHA
    # No subdir: android/ is generated by init before source scanning.
    init:
      - test "$(node --version)" = v24.21.0
      - test "$(npm --version)" = 11.19.0
      - npm ci --include=dev --no-audit --no-fund
      - EXPO_NO_TELEMETRY=1 EXPO_NO_DOTENV=1 npx --no-install expo prebuild --platform android --no-install
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    build:
      - gradle --version | grep -Fx 'Gradle 9.3.1'
      - gradle --project-dir android :app:assembleRelease --no-daemon --console=plain
    ndk: 27.1.12297006

# Enable tag-based updates only after testing extraction from app.json.
AutoUpdateMode: None
UpdateCheckMode: None
